spring.application.name=plataforma-eventos

# Puerto del servidor
server.port=78

# Formato del log
logging.pattern.dateformat=hh:mm

# Sin banner de Spring
spring.main.banner-mode=off

# Cache de Thymeleaf desactivada (desarrollo)
spring.thymeleaf.cache=false

# Conexion a MySQL - base de datos: eventos
spring.datasource.url=jdbc:mysql://localhost:3306/eventos

# Credenciales definidas en el script SQL
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

# Driver y dialecto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Log de SQL en consola
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Configuracion de correo SMTP Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=plataformaeventos@gmail.com
spring.mail.password=###
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Nombre del servidor para enlaces en correos
servidor.http=localhost
