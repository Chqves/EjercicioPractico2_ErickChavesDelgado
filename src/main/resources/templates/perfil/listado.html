<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: encabezado}"/>
        <section th:replace="~{general/fragmentos :: mensajes}"/>
        <section th:replace="~{general/fragmentos :: modalConfirmar}"/>

        <div class="container my-4">
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-id-badge me-2"></i>Perfiles del sistema</h5>
                            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#agregarPerfilModal">
                                <i class="fas fa-plus me-1"></i>Nuevo
                            </button>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped table-hover" th:if="${perfiles != null and !perfiles.empty}">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre del perfil</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${perfiles}">
                                        <td>[[${p.idPerfil}]]</td>
                                        <td>[[${p.titulo}]]</td>
                                        <td>
                                            <a th:href="@{/perfil/modificar/}+${p.idPerfil}" class="btn btn-warning btn-sm">
                                                <i class="fas fa-pencil-alt"></i>
                                            </a>
                                            <button class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#confirmarEliminarModal"
                                                    th:data-bs-id="${p.idPerfil}"
                                                    th:data-bs-descripcion="${p.titulo}"
                                                    onclick="document.getElementById('formEliminarPerfil').action='/perfil/eliminar'; document.getElementById('campoIdModal').name='idPerfil';">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${perfiles == null or perfiles.empty}" class="alert alert-info">
                                No hay perfiles registrados.
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center text-white" style="background-color:#1a1a2e;">
                        <div class="card-body">
                            <h5>Total de perfiles</h5>
                            <h2><i class="fas fa-id-badge me-2"></i>[[${totalPerfiles}]]</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form oculto para eliminar -->
        <form id="formEliminarPerfil" method="post" th:action="@{/perfil/eliminar}">
            <input type="hidden" id="campoIdModal" name="idPerfil"/>
        </form>
        <script>
            document.getElementById('btnConfirmarEliminar').addEventListener('click', function() {
                document.getElementById('formEliminarPerfil').submit();
            });
        </script>

        <!-- Modal agregar perfil -->
        <div class="modal fade" id="agregarPerfilModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Nuevo Perfil</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/perfil/guardar}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre del perfil</label>
                                <input type="text" name="titulo" class="form-control" maxlength="100" required placeholder="Ej: ADMIN"/>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: pie}"/>
    </body>
</html>
