<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: encabezado}"/>
        <section th:replace="~{general/fragmentos :: mensajes}"/>

        <div class="container my-4">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i class="fas fa-pencil-alt me-2"></i>Editar Perfil</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/perfil/guardar}" method="post" th:object="${perfil}">
                                <input type="hidden" name="idPerfil" th:field="*{idPerfil}"/>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nombre del perfil</label>
                                    <input type="text" name="titulo" th:field="*{titulo}" class="form-control" maxlength="100" required/>
                                </div>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/perfil/listado}" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-1"></i>Volver
                                    </a>
                                    <button type="submit" class="btn btn-warning">
                                        <i class="fas fa-save me-1"></i>Actualizar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: pie}"/>
    </body>
</html>
