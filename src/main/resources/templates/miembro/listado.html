<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: encabezado}"/>
        <section th:replace="~{general/fragmentos :: mensajes}"/>
        <section th:replace="~{general/fragmentos :: modalConfirmar}"/>

        <div class="container my-4">
            <div class="row mb-3">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-users me-2"></i>Miembros registrados</h5>
                            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#agregarMiembroModal">
                                <i class="fas fa-plus me-1"></i>Nuevo
                            </button>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped table-hover" th:if="${miembros != null and !miembros.empty}">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Perfil</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${miembros}">
                                        <td>[[${m.idMiembro}]]</td>
                                        <td>[[${m.nombreCompleto}]]</td>
                                        <td>[[${m.correoElectronico}]]</td>
                                        <td>[[${m.perfil?.titulo}]]</td>
                                        <td>
                                            <span th:if="${m.habilitado}" class="badge-estado-activo">Activo</span>
                                            <span th:unless="${m.habilitado}" class="badge-estado-inactivo">Inactivo</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/miembro/modificar/}+${m.idMiembro}" class="btn btn-warning btn-sm">
                                                <i class="fas fa-pencil-alt"></i>
                                            </a>
                                            <button class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#confirmarEliminarModal"
                                                    th:data-bs-id="${m.idMiembro}"
                                                    th:data-bs-descripcion="${m.nombreCompleto}">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${miembros == null or miembros.empty}" class="alert alert-info">
                                No hay miembros registrados.
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center text-white mb-3" style="background-color:#1a1a2e;">
                        <div class="card-body">
                            <h6>Total miembros</h6>
                            <h2><i class="fas fa-users"></i> [[${totalMiembros}]]</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form id="formEliminarMiembro" method="post" th:action="@{/miembro/eliminar}">
            <input type="hidden" id="campoIdModal" name="idMiembro"/>
        </form>
        <script>
            document.getElementById('btnConfirmarEliminar').addEventListener('click', function() {
                document.getElementById('formEliminarMiembro').submit();
            });
        </script>

        <!-- Modal agregar miembro -->
        <div class="modal fade" id="agregarMiembroModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Nuevo Miembro</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/miembro/guardar}" method="post" class="was-validated">
                        <div class="modal-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Nombre completo</label>
                                    <input type="text" name="nombreCompleto" class="form-control" maxlength="150" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Correo electrónico</label>
                                    <input type="email" name="correoElectronico" class="form-control" maxlength="200" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" name="clave" class="form-control" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Perfil</label>
                                    <select name="perfil.idPerfil" class="form-select" required>
                                        <option value="">Seleccione...</option>
                                        <option th:each="p : ${perfiles}" th:value="${p.idPerfil}" th:text="${p.titulo}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Estado</label>
                                    <div class="form-check mt-2">
                                        <input type="checkbox" name="habilitado" class="form-check-input" checked/>
                                        <label class="form-check-label">Habilitado</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: pie}"/>
    </body>
</html>
