<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: encabezado}"/>
        <section th:replace="~{general/fragmentos :: mensajes}"/>

        <div class="container my-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Editar Miembro</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/miembro/guardar}" method="post" th:object="${miembro}">
                                <input type="hidden" name="idMiembro" th:field="*{idMiembro}"/>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Nombre completo</label>
                                        <input type="text" name="nombreCompleto" th:field="*{nombreCompleto}" class="form-control" maxlength="150" required/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Correo electrónico</label>
                                        <input type="email" name="correoElectronico" th:field="*{correoElectronico}" class="form-control" maxlength="200" required/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Contraseña <small class="text-muted">(dejar vacío para mantener)</small></label>
                                        <input type="password" name="clave" th:field="*{clave}" class="form-control"/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Perfil</label>
                                        <select name="perfil.idPerfil" class="form-select" required>
                                            <option th:each="p : ${perfiles}"
                                                    th:value="${p.idPerfil}"
                                                    th:text="${p.titulo}"
                                                    th:selected="${miembro.perfil != null and miembro.perfil.idPerfil == p.idPerfil}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Estado</label>
                                        <div class="form-check mt-2">
                                            <input type="checkbox" name="habilitado" class="form-check-input" th:checked="${miembro.habilitado}"/>
                                            <label class="form-check-label">Habilitado</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/miembro/listado}" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-1"></i>Volver
                                    </a>
                                    <button type="submit" class="btn btn-warning">
                                        <i class="fas fa-save me-1"></i>Actualizar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: pie}"/>
    </body>
</html>
