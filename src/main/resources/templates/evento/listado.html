<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: encabezado}"/>
        <section th:replace="~{general/fragmentos :: mensajes}"/>
        <section th:replace="~{general/fragmentos :: modalConfirmar}"/>

        <div class="container my-4">
            <div class="row mb-3">
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-calendar-check me-2"></i>Gestión de Eventos</h5>
                            <button class="btn btn-success btn-sm"
                                    sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ORGANIZADOR')"
                                    data-bs-toggle="modal" data-bs-target="#agregarEventoModal">
                                <i class="fas fa-plus me-1"></i>Nuevo
                            </button>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped table-hover" th:if="${eventos != null and !eventos.empty}">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Título</th>
                                        <th>Fecha</th>
                                        <th>Aforo</th>
                                        <th>Estado</th>
                                        <th sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ORGANIZADOR')">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ev : ${eventos}">
                                        <td>[[${ev.idEvento}]]</td>
                                        <td>[[${ev.titulo}]]</td>
                                        <td>[[${ev.fechaEvento}]]</td>
                                        <td>[[${ev.aforo}]]</td>
                                        <td>
                                            <span th:if="${ev.habilitado}" class="badge-estado-activo">Activo</span>
                                            <span th:unless="${ev.habilitado}" class="badge-estado-inactivo">Inactivo</span>
                                        </td>
                                        <td sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ORGANIZADOR')">
                                            <a th:href="@{/evento/modificar/}+${ev.idEvento}" class="btn btn-warning btn-sm">
                                                <i class="fas fa-pencil-alt"></i>
                                            </a>
                                            <button class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#confirmarEliminarModal"
                                                    th:data-bs-id="${ev.idEvento}"
                                                    th:data-bs-descripcion="${ev.titulo}">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div th:if="${eventos == null or eventos.empty}" class="alert alert-info">
                                No hay eventos registrados.
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center text-white mb-3" style="background-color:#1a1a2e;">
                        <div class="card-body">
                            <h6>Total eventos</h6>
                            <h2><i class="fas fa-calendar"></i> [[${totalEventos}]]</h2>
                        </div>
                    </div>
                    <div class="card text-center text-white bg-success">
                        <div class="card-body">
                            <h6>Eventos activos</h6>
                            <h2><i class="fas fa-check-circle"></i> [[${totalActivos}]]</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form id="formEliminarEvento" method="post" th:action="@{/evento/eliminar}">
            <input type="hidden" id="campoIdModal" name="idEvento"/>
        </form>
        <script>
            document.getElementById('btnConfirmarEliminar').addEventListener('click', function() {
                document.getElementById('formEliminarEvento').submit();
            });
        </script>

        <!-- Modal agregar evento -->
        <div class="modal fade" id="agregarEventoModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="fas fa-calendar-plus me-2"></i>Nuevo Evento</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/evento/guardar}" method="post" class="was-validated">
                        <div class="modal-body">
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label fw-semibold">Título del evento</label>
                                    <input type="text" name="titulo" class="form-control" maxlength="150" required/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Fecha</label>
                                    <input type="date" name="fechaEvento" class="form-control" required/>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-semibold">Descripción</label>
                                    <textarea name="resumen" class="form-control" rows="3"></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Aforo máximo</label>
                                    <input type="number" name="aforo" class="form-control" min="1" required/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Estado</label>
                                    <div class="form-check mt-2">
                                        <input type="checkbox" name="habilitado" class="form-check-input" checked/>
                                        <label class="form-check-label">Habilitado</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: pie}"/>
    </body>
</html>
