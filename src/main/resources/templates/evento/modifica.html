<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: encabezado}"/>
        <section th:replace="~{general/fragmentos :: mensajes}"/>

        <div class="container my-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i class="fas fa-calendar-edit me-2"></i>Editar Evento</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/evento/guardar}" method="post" th:object="${evento}">
                                <input type="hidden" name="idEvento" th:field="*{idEvento}"/>
                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label fw-semibold">Título</label>
                                        <input type="text" name="titulo" th:field="*{titulo}" class="form-control" maxlength="150" required/>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label fw-semibold">Fecha</label>
                                        <input type="date" name="fechaEvento" th:field="*{fechaEvento}" class="form-control" required/>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label class="form-label fw-semibold">Descripción</label>
                                        <textarea name="resumen" th:field="*{resumen}" class="form-control" rows="3"></textarea>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Aforo máximo</label>
                                        <input type="number" name="aforo" th:field="*{aforo}" class="form-control" min="1" required/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-semibold">Estado</label>
                                        <div class="form-check mt-2">
                                            <input type="checkbox" name="habilitado" class="form-check-input" th:checked="${evento.habilitado}"/>
                                            <label class="form-check-label">Habilitado</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/evento/listado}" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-1"></i>Volver
                                    </a>
                                    <button type="submit" class="btn btn-warning">
                                        <i class="fas fa-save me-1"></i>Actualizar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: pie}"/>
    </body>
</html>
